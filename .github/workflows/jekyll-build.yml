name: Jekyll build check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Ruby and GitHub Pages dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --safe --strict_front_matter --trace

      - name: Verify generated pages and assets
        run: python3 tools/verify_site.py _site

      - name: Save generated site on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site-debug
          path: _site/
          if-no-files-found: ignore
          retention-days: 7
